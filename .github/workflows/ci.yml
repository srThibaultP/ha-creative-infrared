name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  HA_REF: "2026.11.0b2"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: home-assistant/core
          ref: ${{ env.HA_REF }}
          path: ha-core
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install Home Assistant and test helpers
        run: |
          uv venv
          uv pip install -e ./ha-core -e ./ha-core/packages/pytest-home-assistant \
            infrared-protocols==10.5.0 pytest-cov syrupy mypy
      - name: Tests (100% coverage)
        run: uv run --no-sync pytest --cov -p no:cacheprovider
      - name: Strict typing
        run: uv run --no-sync mypy
